<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Checker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Password Strength Checker</h2>
        <p>Enter a password to check how secure it is.</p>
        
        <div class="input-box">
            <input type="password" id="password" placeholder="Enter your password...">
            <button id="toggleBtn">Show</button>
        </div>
        
        <div class="strength-meter">
            <div id="strength-bar"></div>
        </div>
        <p id="strength-text">Strength: <span>None</span></p>
        
        <ul class="requirements">
            <li id="length" class="invalid">At least 8 characters</li>
            <li id="uppercase" class="invalid">At least 1 uppercase letter</li>
            <li id="lowercase" class="invalid">At least 1 lowercase letter</li>
            <li id="number" class="invalid">At least 1 number</li>
            <li id="special" class="invalid">At least 1 special character</li>
        </ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
