<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Checker</title>
    <style>
        body {
            background-color: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            color: #fff;
        }
        .container {
            background-color: #16213e;
            padding: 30px;
            border-radius: 10px;
            width: 350px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 { text-align: center; color: #e94560; }
        .input-box { display: flex; margin-bottom: 15px; }
        input {
            flex: 1; padding: 10px; border: none; border-radius: 5px 0 0 5px; outline: none;
        }
        button {
            padding: 10px 15px; border: none; background-color: #0f3460; color: white; cursor: pointer; border-radius: 0 5px 5px 0;
        }
        .meter { height: 8px; background: #333; border-radius: 5px; margin-bottom: 10px; }
        #bar { height: 100%; width: 0%; border-radius: 5px; transition: 0.3s; }
        ul { list-style: none; padding: 0; font-size: 14px; color: #a0a0a0; }
        li { margin-bottom: 5px; }
        .valid { color: #00ff88; }
        .invalid { color: #a0a0a0; }
    </style>
</head>
<body>

<div class="container">
    <h2>Password Strength Checker</h2>
    <div class="input-box">
        <input type="password" id="pass" placeholder="Type password...">
        <button id="toggle">Show</button>
    </div>
    <div class="meter"><div id="bar"></div></div>
    <p id="text" style="font-weight: bold; margin: 10px 0;">Strength: None</p>
    <ul>
        <li id="len" class="invalid">✖ At least 8 characters</li>
        <li id="up" class="invalid">✖ At least 1 uppercase</li>
        <li id="low" class="invalid">✖ At least 1 lowercase</li>
        <li id="num" class="invalid">✖ At least 1 number</li>
        <li id="spec" class="invalid">✖ At least 1 special char</li>
    </ul>
</div>

<script>
    const pass = document.getElementById('pass');
    const toggle = document.getElementById('toggle');
    const bar = document.getElementById('bar');
    const text = document.getElementById('text');
    
    const req = {
        len: document.getElementById('len'),
        up: document.getElementById('up'),
        low: document.getElementById('low'),
        num: document.getElementById('num'),
        spec: document.getElementById('spec')
    };

    // Show/Hide Button
    toggle.onclick = function() {
        if (pass.type === 'password') {
            pass.type = 'text';
            toggle.innerText = 'Hide';
        } else {
            pass.type = 'password';
            toggle.innerText = 'Show';
        }
    };

    // Main Logic
    pass.oninput = function() {
        const val = pass.value;
        let score = 0;

        if (val.length >= 8) { req.len.className = 'valid'; req.len.innerHTML = '✔ At least 8 characters'; score++; } 
        else { req.len.className = 'invalid'; req.len.innerHTML = '✖ At least 8 characters'; }

        if (/[A-Z]/.test(val)) { req.up.className = 'valid'; req.up.innerHTML = '✔ At least 1 uppercase'; score++; } 
        else { req.up.className = 'invalid'; req.up.innerHTML = '✖ At least 1 uppercase'; }

        if (/[a-z]/.test(val)) { req.low.className = 'valid'; req.low.innerHTML = '✔ At least 1 lowercase'; score++; } 
        else { req.low.className = 'invalid'; req.low.innerHTML = '✖ At least 1 lowercase'; }

        if (/[0-9]/.test(val)) { req.num.className = 'valid'; req.num.innerHTML = '✔ At least 1 number'; score++; } 
        else { req.num.className = 'invalid'; req.num.innerHTML = '✖ At least 1 number'; }

        if (/[^A-Za-z0-9]/.test(val)) { req.spec.className = 'valid'; req.spec.innerHTML = '✔ At least 1 special char'; score++; } 
        else { req.spec.className = 'invalid'; req.spec.innerHTML = '✖ At least 1 special char'; }
if (val.length === 0) {
            bar.style.width = '0%';
            text.innerText = 'Strength: None';
            text.style.color = '#fff';
        } else if (score <= 2) {
            bar.style.width = '40%';
            bar.style.backgroundColor = '#ff4d4d';
            text.innerText = 'Strength: Weak';
            text.style.color = '#ff4d4d';
        } else if (score === 3 || score === 4) {
            bar.style.width = '70%';
            bar.style.backgroundColor = '#ffcc00';
            text.innerText = 'Strength: Medium';
            text.style.color = '#ffcc00';
        } else if (score === 5) {
            bar.style.width = '100%';
            bar.style.backgroundColor = '#00ff88';
            text.innerText = 'Strength: Strong';
            text.style.color = '#00ff88';
        }
    };
</script>
</body>
</html>
